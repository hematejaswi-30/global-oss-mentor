<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSS Contrib Guide | Powered by Gemma 4</title>
    <!-- Clean Bootstrap CSS Template -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Marked.js for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 3rem 0; border-radius: 0 0 20px 20px; }
        .result-content { line-height: 1.6; font-size: 1.1rem; }
        .result-content h2, .result-content h3 { color: #764ba2; margin-top: 20px; }
    </style>
</head>
<body>
    
    <div class="hero text-center shadow">
        <h1 class="fw-bold">🚀 Global OSS Mentor</h1>
        <p class="lead">Empowering the global open-source community with Gemma 4</p>
    </div>

    <div class="container mt-5" style="max-width: 800px;">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <form id="repoForm">
                    <label class="form-label fw-bold">Enter a GitHub Repository URL</label>
                    <div class="input-group mb-3">
                        <input type="url" id="repoUrl" class="form-control form-control-lg" placeholder="e.g., https://github.com/facebook/react" required>
                        <button class="btn btn-primary btn-lg" type="submit" id="analyzeBtn" style="background-color: #764ba2; border-color: #764ba2;">Analyze Repo</button>
                    </div>
                    <small class="text-muted">The agent will read the README and output a beginner-friendly contribution guide.</small>
                </form>
            </div>
        </div>

        <div id="loading" class="text-center d-none my-5">
            <div class="spinner-border" style="color: #764ba2;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 fw-bold text-muted">Gemma 4 is analyzing the repository...</p>
        </div>

        <div id="resultCard" class="card shadow-sm border-0 d-none mb-5">
            <div class="card-body p-5 result-content" id="resultContent">
                <!-- AI response injected here -->
            </div>
        </div>
    </div>

    <script>
        document.getElementById('repoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('repoUrl').value;
            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const resultCard = document.getElementById('resultCard');
            const resultContent = document.getElementById('resultContent');

            // UI State change
            btn.disabled = true;
            loading.classList.remove('d-none');
            resultCard.classList.add('d-none');

            try {
                const res = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repo_url: url })
                });
                const data = await res.json();
                
                if(data.error) {
                    resultContent.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                } else {
                    // Convert Markdown to HTML
                    resultContent.innerHTML = marked.parse(data.result);
                }
                resultCard.classList.remove('d-none');
            } catch (err) {
                resultContent.innerHTML = `<div class="alert alert-danger">An error occurred trying to connect to the server.</div>`;
                resultCard.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                loading.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
